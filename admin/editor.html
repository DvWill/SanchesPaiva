<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar notícia | Sanches Paiva</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="/data.js" defer></script><script src="/supabase.js" defer></script><script src="/admin.js" defer></script></head><body class="admin-body"><header class="admin-header"><a class="brand" href="/admin"><b>Sanches Paiva</b><span>Painel editorial</span></a><a href="/admin">← Notícias</a></header><main class="admin-main" data-protected><div class="admin-title"><div><p class="eyebrow">Editor</p><h1 id="editor-title">Nova notícia</h1></div><button id="preview-button" type="button" class="btn btn-secondary">Visualizar prévia</button></div><form id="post-form" class="editor-form"><section class="admin-card form-grid"><label class="span-2">Título<input name="title" required maxlength="180"></label><label>Slug<input name="slug" required pattern="[a-z0-9-]+"></label><label>Categoria<select name="category" required></select></label><label class="span-2">Resumo<textarea name="excerpt" rows="3" required maxlength="360"></textarea></label><label class="span-2">Conteúdo completo em Markdown<textarea name="content" rows="18" required></textarea><small>Use ## para subtítulos, **negrito** e &gt; para destaques. Scripts e HTML são exibidos como texto.</small></label><label>Imagem de capa<input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><small>JPEG, PNG, WebP ou AVIF, até 8 MB.</small></label><label>Texto alternativo<input name="cover_alt" required maxlength="220"></label><input name="cover_url" type="hidden"><label>Galeria opcional<input id="gallery-files" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple></label><label>Tags<input name="tags" placeholder="cultura, comunidade"></label><label>Status<select name="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select></label><label>Data de publicação<input name="published_at" type="datetime-local"></label><label class="check"><input name="featured" type="checkbox"> Notícia em destaque</label><label class="span-2">Referência interna do Instagram<input name="source_url" type="url" placeholder="https://www.instagram.com/…"></label><label>Título para SEO<input name="seo_title" maxlength="70"></label><label>Descrição para SEO<textarea name="seo_description" rows="3" maxlength="170"></textarea></label></section><div class="editor-actions"><button class="btn" type="submit">Salvar notícia</button><button id="delete-post" class="danger" type="button" hidden>Excluir notícia</button><p class="admin-message" role="status" aria-live="polite"></p></div></form><dialog id="preview-dialog"><button class="dialog-close" type="button">Fechar</button><article id="preview-content" class="preview-content"></article></dialog></main></body></html>
