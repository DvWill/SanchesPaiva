<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demandas cidadãs | Sanches Paiva</title>
<link rel="stylesheet" href="/styles.css?v=texto-sem-quebra-20260915">
<link rel="stylesheet" href="/admin.css?v=alo-demandas-20260921">
<script src="/data.js" defer>
</script>
<script src="/supabase.js" defer>
</script>
<script src="/admin.js" defer>
</script>
<script src="/citizen-admin.js?v=alo-demandas-20260921" defer>
</script>
</head>
<body class="admin-body">
<header class="admin-header">
<a class="brand" href="/admin/demandas">
<b>Sanches Paiva</b>
<span>Atendimento ao cidadão</span>
</a>
<div>
<a href="/admin">Notícias</a>
<a href="/" target="_blank">Ver site ↗</a>
<button id="logout" type="button">Sair</button>
</div>
</header>
<main class="admin-main" data-protected>
<div class="admin-title">
<div>
<p class="eyebrow">Alô, Sanches</p>
<h1>Demandas</h1>
</div>
</div>
<section id="demand-stats" class="stats demand-stats" aria-label="Resumo das demandas">
</section>
<form id="demand-filters" class="admin-card demand-filters">
<label>Buscar<input name="search" type="search" placeholder="Protocolo, nome, telefone ou assunto">
</label>
<label>Assunto<select name="category">
<option value="">Todas</option>
</select>
</label>
<label>Status<select name="status">
<option value="">Todos</option>
</select>
</label>
<label>De<input name="from" type="date">
</label>
<label>Até<input name="to" type="date">
</label>
<div class="filter-actions">
<button class="btn" type="submit">Filtrar</button>
<button class="btn-secondary" type="reset">Limpar</button>
</div>
</form>
<p class="admin-message" role="status" aria-live="polite">
</p>
<div id="demand-list" class="demand-list" aria-busy="true">
</div>
</main>
</body>
</html>
